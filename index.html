<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

<style>
:root{--bg:#f7f3ec;--panel:#fff;--panel2:#f3ede4;--line:#e6ddd0;--text:#241F20;--muted:#6b5f55;--brand:#A5022F;--brand-t:#A5022F;--brand2:#991A36;--brand-soft:#f8e6ea;--brand-ink:#7d0224;--tan:#D0BC9B;--wood:#A66648;
 --demand:#A66648;--supply:#0072B2;--cost:#9a7b00;--up:#047857;--up-bg:#e7f6ef;--down:#b4410e;--down-bg:#fdeee6;--flat-bg:#efe9e0;--warn:#9a3412;--warn-bg:#fff4ec;
 --store:#0f766e;--rec:#A5022F;--shadow:0 1px 2px rgba(36,31,32,.06),0 4px 16px rgba(36,31,32,.07);--r:16px;--onbrand:#fff;
 --side:244px;--top:56px;--tab:64px;--safe-b:env(safe-area-inset-bottom,0px);font-synthesis:none}
[data-theme=dark]{--bg:#111111;--panel:#241F20;--panel2:#2e2829;--line:#3b3435;--text:#f5efe6;--muted:#b9ad9c;--brand:#A5022F;--brand-t:#D0BC9B;--brand2:#991A36;--brand-soft:rgba(165,2,47,.28);--brand-ink:#f5efe6;
 --demand:#D0BC9B;--supply:#56B4E9;--cost:#e0b400;--up:#34d399;--up-bg:#0f2a20;--down:#fb923c;--down-bg:#3a1c0e;--flat-bg:#342e2f;--warn:#fdba74;--warn-bg:#3a2210;--store:#2dd4bf;--rec:#e0234f;--shadow:0 1px 2px rgba(0,0,0,.45),0 6px 20px rgba(0,0,0,.4)}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit}a{color:var(--brand-t)}
.ico{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:3px solid var(--tan);outline-offset:2px}
/* layout */
.app{position:fixed;inset:0;display:grid;grid-template-rows:var(--top) 1fr calc(var(--tab) + var(--safe-b));grid-template-columns:100%;transition:opacity .6s ease,transform .6s cubic-bezier(.2,.8,.2,1)}
.app.pre{opacity:0;transform:scale(.985)}
.side{display:none}
.top{display:flex;align-items:center;gap:8px;padding:0 8px 0 14px;background:var(--panel);border-bottom:1px solid var(--line);z-index:20;min-width:0}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--text);min-width:0}
.logo svg{width:28px;height:28px;flex:none}
.word{font-weight:800;font-size:18px;letter-spacing:-.4px}.word i{font-style:normal;color:var(--brand-t)}
.ws{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px 0 6px;border-radius:999px;background:var(--brand);color:#fff;border:1px solid var(--brand2);font-size:13px;font-weight:600;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.ws img{width:22px;height:22px;flex:none}
.sp1{flex:1}
.ibtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.ibtn:hover{background:var(--panel2)}
.ibtn[disabled]{opacity:.4;cursor:default}
.vtitle{display:none}
main{position:relative;overflow:hidden;min-height:0}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;opacity:0;visibility:hidden;transform:translateY(8px);transition:opacity .22s ease,transform .22s ease,visibility 0s .22s}
.view.on{opacity:1;visibility:visible;transform:none;transition:opacity .22s ease,transform .22s ease}
.mapslot{position:sticky;top:0;z-index:5;height:36vh;min-height:220px;max-height:380px;background:var(--panel2);border-bottom:1px solid var(--line)}
.vbody{padding:14px 14px 28px;max-width:760px;margin:0 auto}
/* tab bar */
.tabbar{display:grid;grid-template-columns:repeat(5,1fr);background:var(--panel);border-top:1px solid var(--line);padding-bottom:var(--safe-b);z-index:20}
.tb{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);min-height:44px;cursor:pointer;position:relative}
.tb .ico{width:22px;height:22px}
.tb[aria-current=page]{color:var(--brand-t)}
.tb[aria-current=page]::before{content:"";position:absolute;top:0;left:26%;right:26%;height:3px;border-radius:0 0 3px 3px;background:var(--brand)}
.tb.pulse{animation:tbp 1.1s ease 2}
@keyframes tbp{50%{scale:1.12}}
/* more sheet */
.scrim{position:fixed;inset:0;background:rgba(10,12,20,.42);z-index:40;opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s .2s}
.scrim.on{opacity:1;visibility:visible;transition:opacity .2s}
.more{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--panel);border-radius:20px 20px 0 0;padding:8px 12px calc(16px + var(--safe-b));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);box-shadow:0 -8px 30px rgba(0,0,0,.2)}
.more.on{transform:none}
.more .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.mi{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;border:0;background:none;border-radius:12px;padding:0 12px;text-align:left;cursor:pointer;font-weight:600}
.mi:hover,.mi[aria-current=page]{background:var(--brand-soft);color:var(--brand-ink)}
.mi .ico{width:22px;height:22px}.mi small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
/* type + cards */
h1{font-size:22px;letter-spacing:-.4px;margin:2px 0 2px}h2{font-size:16px;margin:18px 0 8px;letter-spacing:-.2px}
.eyebrow{font-size:12px;font-weight:700;color:var(--brand-t);letter-spacing:.6px;text-transform:uppercase}
.sub{color:var(--muted);font-size:13px;margin:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px}
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.k{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 11px;min-width:0}
.card .k,.k.flat{background:var(--panel2);border-color:transparent}
.kh{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.kh .ico{width:14px;height:14px}
.kv{font-size:22px;font-weight:800;letter-spacing:-.4px;font-variant-numeric:tabular-nums;line-height:1.2;margin-top:3px;white-space:nowrap}
.kv small{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:0}
.kx{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);margin-top:5px;min-height:16px;flex-wrap:wrap}
.kx span{min-width:0}
.gbar{position:relative;flex:1;min-width:40px;height:6px;border-radius:3px;background:var(--line);overflow:visible;display:block}
.gbar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.gbar b{position:absolute;top:-3px;width:2px;height:12px;background:var(--text);border-radius:1px}
.ratio{display:flex;flex:1;min-width:40px;height:6px;border-radius:3px;overflow:hidden;gap:2px}.ratio i{display:block;height:100%}
.chip2{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;border-radius:999px;padding:1px 8px;white-space:nowrap}
.chip2.up{background:var(--up-bg);color:var(--up)}.chip2.down{background:var(--down-bg);color:var(--down)}.chip2.flat{background:var(--flat-bg);color:var(--muted)}
.riskrow{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
.riskchip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--warn);background:var(--warn-bg);border:1px solid color-mix(in srgb,var(--warn) 25%,transparent);border-radius:999px;padding:3px 9px}
.riskchip .ico{width:13px;height:13px}
.mbars{display:flex;align-items:flex-end;gap:2px;height:22px;flex:1;min-width:40px}.mbars i{flex:1;background:var(--demand);opacity:.8;border-radius:2px 2px 0 0;min-height:2px}
.spark{width:100%;height:26px;display:block}
.stack{display:flex;height:8px;border-radius:4px;overflow:hidden;flex:1;min-width:60px}.stack i{display:block;height:100%}
/* insights */
.ins{display:grid;gap:8px;margin-top:8px}
.insight{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:64px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow);cursor:pointer;transition:transform .15s ease,border-color .15s}
.insight:hover{transform:translateY(-1px);border-color:var(--tan)}
.insight .ib{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--brand-soft);color:var(--brand-t)}
.insight .ib .ico{width:20px;height:20px}
.insight b{display:block;font-size:14.5px;line-height:1.3}.insight span{font-size:12.5px;color:var(--muted)}
.insight .go{margin-left:auto;color:var(--muted);flex:none}
.insight .big{margin-left:auto;font-size:20px;font-weight:800;color:var(--brand-t);flex:none;font-variant-numeric:tabular-nums}
/* lists */
.rows{display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;width:100%;min-height:52px;text-align:left;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);cursor:pointer}
.row:hover{border-color:var(--tan)}
.row .rk{width:28px;height:28px;border-radius:8px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12.5px;color:var(--muted)}
.row .rt{min-width:0}.row .rt b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .rt span{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.row .rv{text-align:right;font-weight:800;font-variant-numeric:tabular-nums;font-size:15px}.row .rv small{display:block;font-size:11px;font-weight:600;color:var(--muted)}
.row .rbar{grid-column:2/4;display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted)}
.rating{display:inline-flex;align-items:center;gap:4px;font-weight:800}.rating i{width:10px;height:10px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.25)}
/* controls */
.seg{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--panel2);overflow-x:auto;scrollbar-width:none;margin:10px 0}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;min-height:40px;padding:0 12px;border:0;border-radius:9px;background:none;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--panel);color:var(--text);box-shadow:var(--shadow)}
.filters{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
.filters select,.filters input{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:0 12px;font:inherit;font-size:14px;min-width:0}
.filters select{flex:0 0 132px}.filters input{flex:1 1 160px}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn[disabled]{opacity:.45;cursor:default}
.btn.block{width:100%}
.lhead{display:flex;align-items:center;gap:8px;margin-top:4px}.lhead>div{flex:1;min-width:0}
/* hbars */
.hb{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(60px,1fr) auto;align-items:center;gap:8px;font-size:13px;padding:5px 0}
.hb .l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hb .v{font-variant-numeric:tabular-nums;font-weight:700;font-size:12.5px;text-align:right;min-width:40px}
.hb .t{height:8px;border-radius:4px;background:var(--line);position:relative;overflow:hidden}.hb .t i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
/* next sites cards */
.scard{padding:14px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow);margin-bottom:10px;cursor:pointer;transition:border-color .15s}
.scard.sel{border-color:var(--brand);box-shadow:0 0 0 2px color-mix(in srgb,var(--brand) 35%,transparent),var(--shadow)}
.ctop{display:flex;align-items:flex-start;gap:10px}
.rank{width:36px;height:36px;border-radius:10px;background:var(--brand);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.ttl{flex:1;min-width:0}.ttl b{display:block;font-size:16px;line-height:1.25}.ttl span{font-size:12.5px;color:var(--muted)}
.score{text-align:right;flex:none}.score b{display:block;font-size:24px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}.score span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.hl{font-size:13px;font-weight:600;color:var(--brand-t);margin:8px 0 2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.why{margin-top:8px;width:100%}
details.sec{border:1px solid var(--line);border-radius:14px;background:var(--panel);margin:8px 0;overflow:hidden}
details.sec>summary{list-style:none;min-height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-weight:700;cursor:pointer}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"▾";color:var(--brand-t);transition:transform .2s}details.sec[open]>summary::after{transform:rotate(180deg)}
details.sec>div{padding:0 14px 12px}
.note{font-size:12.5px;color:var(--muted)}
.quote{font-size:13px;border-left:3px solid var(--brand);padding:4px 10px;margin:8px 0;color:var(--text)}
.src{font-size:12.5px;padding:8px 0;border-top:1px solid var(--line);overflow-wrap:anywhere}.src b{display:block;text-transform:capitalize}
.disc{font-size:11.5px;color:var(--muted);margin:14px 0 4px}
.post{font-size:13px;padding:10px 12px;border-radius:12px;background:var(--panel2);margin:6px 0;overflow-wrap:anywhere}.post span{display:block;color:var(--muted);font-size:11.5px;margin-top:4px}
/* map */
#mapwrap{position:absolute;inset:0}
#map{position:absolute;inset:0}
.chips{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;z-index:3;pointer-events:none}
.chips::-webkit-scrollbar{display:none}
.chip{pointer-events:auto;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 11px;border-radius:999px;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(6px);font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;box-shadow:var(--shadow);position:relative}
.chip::after{content:"";position:absolute;inset:-4px 0}
.chip[aria-pressed=false]{opacity:.55}
.chip .sw{width:14px;height:14px;display:inline-block;flex:none}
.legbtn{position:absolute;left:8px;bottom:8px;z-index:3}
.legend{position:absolute;left:8px;bottom:60px;z-index:4;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12px;box-shadow:var(--shadow);display:none;max-width:240px}
.legend.on{display:block}.legend div{display:flex;align-items:center;gap:8px;margin:3px 0}.legend img{width:20px;height:20px}
.legend i{width:12px;height:12px;display:inline-block;flex:none}
.maplibregl-ctrl-group button{width:44px!important;height:44px!important}
.maplibregl-popup-content{background:var(--panel);color:var(--text);border-radius:12px;box-shadow:var(--shadow);font-size:13px;padding:12px 30px 12px 12px}
.maplibregl-popup-tip{border-top-color:var(--panel)!important;border-bottom-color:var(--panel)!important}
.maplibregl-popup-close-button{width:32px;height:32px;font-size:20px;color:var(--muted)}
.pophd{display:flex;align-items:center;gap:8px;margin-bottom:4px}.pophd img{width:24px;height:24px}
.rpin{border:0;background:none;padding:0;cursor:pointer;width:44px;height:52px;display:flex;align-items:flex-start;justify-content:center}
.rpin span{width:34px;height:34px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#241F20;border:3px solid var(--rec);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(0,0,0,.3);margin-top:4px}
.rpin b{transform:rotate(45deg);color:#fff;font-size:14px}
.rpin.sel span{background:var(--brand);border-color:var(--tan);width:40px;height:40px}
.mskel{position:absolute;inset:0;background:linear-gradient(100deg,var(--panel2) 30%,var(--line) 50%,var(--panel2) 70%);background-size:300% 100%;animation:sk 1.4s linear infinite;z-index:2;transition:opacity .4s}
.mskel.gone{opacity:0;pointer-events:none}
@keyframes sk{to{background-position:-150% 0}}
/* desktop */
@media (min-width:900px){
 .app{grid-template-columns:var(--side) 1fr;grid-template-rows:var(--top) 1fr}
 .side{display:flex;flex-direction:column;grid-row:1/3;background:var(--panel);border-right:1px solid var(--line);padding:14px 12px;gap:4px;overflow-y:auto}
 .side .logo{padding:4px 8px 12px}
 .side .ws{margin:0 4px 12px;height:40px;border-radius:12px;padding:0 12px 0 8px}
 .nl{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border-radius:10px;border:0;background:none;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;text-align:left;width:100%}
 .nl:hover{background:var(--panel2);color:var(--text)}
 .nl[aria-current=page]{background:var(--brand);color:#fff}
 .nl .ico{width:19px;height:19px}
 .navsep{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;padding:14px 12px 4px}
 .sidefoot{margin-top:auto;font-size:11px;color:var(--muted);padding:12px 8px 0;border-top:1px solid var(--line)}
 .top{grid-column:2;padding:0 14px 0 22px}
 .top .logo,.top .ws{display:none}
 .vtitle{display:block;font-weight:800;font-size:17px;letter-spacing:-.3px}
 .tabbar{display:none}
 main{grid-column:2}
 .view.hasmap{display:grid;grid-template-columns:minmax(400px,470px) 1fr;overflow:hidden}
 .view.hasmap .vbody{overflow-y:auto;height:100%;max-width:none;margin:0;padding:18px 18px 30px;grid-column:1;grid-row:1}
 .view.hasmap .mapslot{position:relative;height:auto;max-height:none;grid-column:2;grid-row:1;border-bottom:0;border-left:1px solid var(--line)}
 .view:not(.hasmap) .vbody{padding:22px 28px 40px;max-width:1080px}
 .kgrid.k3{grid-template-columns:repeat(3,1fr)}
 #v-home .kgrid{grid-template-columns:repeat(3,1fr)}
 .twocol{display:grid;grid-template-columns:1fr 1fr;gap:16px}
 .more,.scrim{display:none}
}
@media (max-width:899px){.deskonly{display:none!important}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:0s!important;animation:none!important}}
/* splash */
#splash{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;color:#f5efe6;background:radial-gradient(110% 70% at 50% 0%,#5a0f22 0%,#1a1415 58%,#0e0b0b 100%);overflow:hidden;cursor:pointer;transition:opacity .55s ease,transform .55s ease}
#splash[hidden]{display:none}

   Header, tab bar and map are fixed; the panel is normal flow below a map-height spacer; root scroll-snap gives two stops. */
:root{--sat:env(safe-area-inset-top,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
@media (max-width:899px){
 :root{--vh-s:100vh;--vh-l:100vh}
 @supports (height:100svh){:root{--vh-s:100svh;--vh-l:100lvh}}
 :root{--hdr:calc(var(--top) + var(--sat));--bar:calc(var(--tab) + var(--safe-b));--mapH:calc((var(--vh-s) - var(--hdr) - var(--bar)) * .41)}
 html{height:auto;scroll-snap-type:y mandatory;scroll-padding-top:var(--hdr);overflow-x:hidden}
 body{height:auto;min-height:var(--vh-l);overflow:visible;overflow-x:hidden;overscroll-behavior-y:auto;padding:var(--hdr) 0 var(--bar)}
 .app,.app.pre{position:static;display:block;transform:none}
 .top{position:fixed;top:0;left:0;right:0;height:var(--hdr);padding-top:var(--sat);padding-left:calc(14px + var(--sal));padding-right:calc(8px + var(--sar))}

 .view.hasmap .snaptop{display:block;height:var(--mapH);scroll-snap-align:start;scroll-snap-stop:always}
 .view.hasmap .vbody{position:relative;z-index:6;max-width:none;margin:0;padding:0;background:var(--bg);border-radius:18px 18px 0 0;box-shadow:0 -8px 24px rgba(0,0,0,.35);min-height:var(--vh-l);scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column}
 .view.hasmap .grab{display:flex;flex:none;height:22px;width:100%;border:0;background:none;justify-content:center;align-items:center;cursor:pointer;padding:0}

 #mapwrap .maplibregl-ctrl-top-right{right:var(--sar)}
 .more{padding-left:calc(12px + var(--sal));padding-right:calc(12px + var(--sar))}
}
.snaptop{display:none}

.chips{justify-content:space-between;overflow:visible}

<script>
"use strict";
const D=window.DATA, REC=D.recs, W=D.weights, S=D.stores;
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const f1=n=>n==null||isNaN(n)?"–":Number(n).toFixed(1);

  const nums=$("#spNums");nums.innerHTML=NUMS.map((x,i)=>`<div class="sp-n" data-i="${i}"><b>0</b><span>${x.lab}</span></div>`).join("");
  const sp=$("#spIn"),cv=$("#spMap");sp.classList.remove("go");void sp.offsetWidth;$("#spWs").classList.remove("on");$("#spOpen").hidden=true;
  if(RM){$("#spWs").classList.add("on");$$(".sp-n").forEach((e,i)=>{e.classList.add("on");e.querySelector("b").innerHTML=fmt(NUMS[i].to)+(NUMS[i].suf?`<small>${NUMS[i].suf}</small>`:"");});
    $("#spOpen").hidden=false;$("#spOpen").classList.add("on");imgReady.then(()=>spDraw(cv,1,1));return;}
  sp.classList.add("go");const T0=performance.now();
  const loop=t=>{const e=t-T0;spDraw(cv,Math.min(1,Math.max(0,(e-500)/2000)),Math.max(0,(e-2400)/900));if(introOn&&e<3600)raf=requestAnimationFrame(loop);};raf=requestAnimationFrame(loop);
  timers.push(setTimeout(()=>$("#spWs").classList.add("on"),800));
  $$(".sp-n").forEach((e,i)=>timers.push(setTimeout(()=>{e.classList.add("on");countUp(e.querySelector("b"),NUMS[i].to,NUMS[i].suf,900);},1250+i*260)));
  timers.push(setTimeout(endIntro,4300));}
function endIntro(){if(!introOn)return;introOn=false;timers.forEach(clearTimeout);timers=[];cancelAnimationFrame(raf);
  sessionStorage.setItem("ssIntroSeen","1");SP.classList.add("out");$("#app").classList.remove("pre");
  setTimeout(()=>{SP.hidden=true;},RM?0:560);
  if(!isDesk()&&!RM){const t=$('.tb[data-v="next"]');if(t){t.classList.remove("pulse");setTimeout(()=>t.classList.add("pulse"),700);}}
  if(cur==="home"&&loaded&&!RM){map.jumpTo({center:[-96,38],zoom:2.6});setTimeout(fitUS,250);}}
SP.addEventListener("click",endIntro);$("#spSkip").addEventListener("click",e=>{e.stopPropagation();endIntro();});$("#spOpen").addEventListener("click",e=>{e.stopPropagation();endIntro();});
addEventListener("keydown",e=>{if(introOn&&(e.key==="Escape"||e.key==="Enter"||e.key===" ")){e.preventDefault();endIntro();}});

/* ================= init ================= */
route();
if(!sessionStorage.getItem("ssIntroSeen"))startIntro(false);else $("#app").classList.remove("pre");
</script>
</body>
